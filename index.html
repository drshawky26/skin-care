  <div id="catHoverPreview" class="cat-hover-preview hidden">
  <img id="catHoverImg" src="" alt="">
  <script>
    const dock = document.getElementById('sidebarDock');
    const bar  = document.getElementById('catsBar');
  
    // هل الجهاز يدعم Hover وماوس دقيقة؟ (كمبيوتر/لاب حتى لو العرض صغير)
    const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  
    function openBar(){
      bar.classList.add('is-open');
      bar.classList.remove('is-collapsed');
    }
    function closeBar(){
      bar.classList.remove('is-open');
      bar.classList.add('is-collapsed');
    }
    function toggleBar(){
      bar.classList.contains('is-open') ? closeBar() : openBar();
    }
  
    // ✅ Hover (للكمبيوتر) — يشتغل حتى لو window صغير
    if (canHover){
      // افتح لما الماوس يدخل على الزر أو البار
      dock.addEventListener('mouseenter', openBar);
      bar.addEventListener('mouseenter', openBar);
  
      // اقفل لما الماوس يطلع من الاثنين
      const leave = () => setTimeout(() => {
        // اقفل لو الماوس مش فوق الزر ولا البار
        if (!dock.matches(':hover') && !bar.matches(':hover')) closeBar();
      }, 80);
  
      dock.addEventListener('mouseleave', leave);
      bar.addEventListener('mouseleave', leave);
    }
  
    // ✅ Click / Touch (للموبايل والتابلت)
    dock.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleBar();
    });
  
    // اقفل لو ضغطت برّه
    document.addEventListener('click', (e) => {
      if (!bar.contains(e.target) && e.target !== dock) closeBar();
    });
  
    // اقفل بـ ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeBar();
    });
  </script>
  
  
  <script>
  const catsInner = document.querySelector('.cats-header .sidebar-inner');

  if (catsInner) {
    catsInner.addEventListener('wheel', (e) => {
      // لو فيه سكرول رأسي
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();               // امنعي السلوك الافتراضي
        catsInner.scrollLeft += e.deltaY; // حوّليه لأفقي
      }
    }, { passive: false });
  }
</script>



<script>

    document.documentElement.style.setProperty('--catsH', h + 'px');
  }

  window.addEventListener('resize', syncHeadersOffset);
</script>
